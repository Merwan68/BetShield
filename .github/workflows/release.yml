name: Release Android App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or version for release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    name: Build Signed / Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Build Environment (Keystore & Env)
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Prepare Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 9.3.1
            chmod +x gradlew
          fi

      - name: Decode Keystore (If provided via Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "Decoded release upload keystore."
          else
            echo "No KEYSTORE_BASE64 secret provided; skipping release keystore decode."
          fi

      - name: Build APK and App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -f "$KEYSTORE_PATH" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            ./gradlew assembleRelease bundleRelease --stacktrace
          else
            echo "Building shareable debug APK (configure KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD secrets for Play release builds)."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          find app/build/outputs/ -name "*.apk" -exec cp {} release-assets/ \;
          find app/build/outputs/ -name "*.aab" -exec cp {} release-assets/ \; 2>/dev/null || true
          ls -la release-assets/

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: betshield-release-bundle
          path: release-assets/
          retention-days: 30
